<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Counties | We've been busy in your area</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
  :root{
    --tc-green:#3d9b35;
    --tc-green-dark:#1e6b2e;
    --tc-ink:#2a3230;
    --tc-body:#5a6360;
    --tc-bg:#f6f5f0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--tc-bg);color:var(--tc-ink);
    padding:18px clamp(16px,4vw,32px);
  }
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;color:var(--tc-ink);margin-bottom:14px}
  .eyebrow svg{width:16px;height:16px;fill:var(--tc-green-dark)}
  h1{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
  h1 span{color:var(--tc-green)}
  .sub{font-size:17px;color:var(--tc-body);margin-bottom:6px}
  .note{font-size:14px;color:var(--tc-body);margin-bottom:26px}
  .map-wrap{border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(30,60,40,.14);
    background:#fff;position:relative}
  #map{height:min(78vh,640px);width:100%;background:#e8efe9}
  .map-footer{display:flex;justify-content:space-between;align-items:center;
    padding:12px 18px;background:#fff;border-top:1px solid #eceae2}
  .stat{font-size:14px;color:var(--tc-body)}
  .stat b{color:var(--tc-green-dark);font-weight:800;font-size:16px}
  .home-btn{border:1px solid #d8d5ca;background:#fff;border-radius:8px;padding:8px 14px;
    font-size:13px;font-weight:600;color:var(--tc-ink);cursor:pointer}
  .home-btn:hover{background:var(--tc-bg)}

  /* single install pin */
  .tc-pin{position:relative;width:30px;height:38px}
  .tc-pin svg{position:absolute;inset:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
  .tc-pin b{position:absolute;top:5px;left:0;width:30px;text-align:center;
    font:800 12px/16px -apple-system,'Segoe UI',sans-serif;color:#fff}

  /* clusters */
  .tc-cluster{display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:var(--tc-green);color:#fff;font-weight:800;
    border:3px solid rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(20,60,30,.3)}
  .tc-cluster.m{background:var(--tc-green-dark)}
  .tc-cluster.l{background:#154d21}

  .leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.16)}
  .leaflet-popup-content{margin:12px 16px;font-family:inherit}
  .pop-count{font-weight:800;color:var(--tc-green-dark);font-size:15px}
  .pop-pc{font-size:12px;color:var(--tc-body);letter-spacing:.04em}

  .pc-search{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .pc-search input{flex:1;min-width:200px;max-width:340px;padding:11px 14px;border:1px solid #d8d5ca;
    border-radius:9px;font-size:15px;font-family:inherit;color:var(--tc-ink);background:#fff}
  .pc-search input:focus{outline:none;border-color:var(--tc-green);box-shadow:0 0 0 3px rgba(61,155,53,.15)}
  .pc-search button{padding:11px 20px;border:none;border-radius:9px;background:var(--tc-green-dark);
    color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .pc-search button:hover{background:var(--tc-green)}
  .pc-msg{font-size:13px;color:var(--tc-body);min-height:18px}
  .pc-msg.err{color:#b23b3b}
  .you-pin{background:var(--tc-green-dark);width:20px;height:20px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}

</style>
</head>
<body>

  <div class="pc-search">
    <input id="pcInput" type="text" placeholder="Enter your postcode, e.g. GU15 3DF" autocomplete="postal-code" />
    <button id="pcBtn" type="button">Find my area</button>
  </div>
  <div class="pc-msg" id="pcMsg"></div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-footer">
      <div class="stat"><b id="statInstalls">0</b> installations across <b id="statAreas">0</b> local postcodes</div>
      <button class="home-btn" onclick="resetView()">Reset view</button>
    </div>
  </div>

const HOME = {center:[51.24,-0.75], zoom:10};
const map = L.map('map',{scrollWheelZoom:true, zoomSnap:.5}).setView(HOME.center, HOME.zoom);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom:18
}).addTo(map);

function pinIcon(count){
  const label = count > 1 ? count : '';
  return L.divIcon({
    className:'',
    html:`<div class="tc-pin">
      <svg viewBox="0 0 30 38"><path fill="#3d9b35" stroke="#fff" stroke-width="2"
        d="M15 1C7.8 1 2 6.8 2 14c0 9.6 13 23 13 23s13-13.4 13-23C28 6.8 22.2 1 15 1z"/>
        ${count<=1?'<circle cx="15" cy="13.5" r="4.5" fill="#fff"/>':''}</svg>
      <b>${label}</b></div>`,
    iconSize:[30,38], iconAnchor:[15,38], popupAnchor:[0,-34]
  });
}

const clusters = L.markerClusterGroup({
  maxClusterRadius:52,
  showCoverageOnHover:false,
  iconCreateFunction: c => {
    const n = c.getAllChildMarkers().reduce((s,m)=>s+m.options.installs,0);
    const size = n<25?38:n<150?46:56;
    const cls = n<25?'':n<150?'m':'l';
    return L.divIcon({html:`<div class="tc-cluster ${cls}" style="width:${size}px;height:${size}px;font-size:${n<25?13:15}px">${n}</div>`,
      className:'', iconSize:[size,size]});
  }
});

let totalInstalls = 0;
DATA.forEach(([lat,lng,count,pc])=>{
  totalInstalls += count;
  const m = L.marker([lat,lng],{icon:pinIcon(count), installs:count});
  m.bindPopup(`<div class="pop-count">${count} installation${count>1?'s':''}</div><div class="pop-pc">near ${pc}</div>`);
  clusters.addLayer(m);
});
map.addLayer(clusters);

document.getElementById('statInstalls').textContent = totalInstalls.toLocaleString('en-GB');
document.getElementById('statAreas').textContent = DATA.length.toLocaleString('en-GB');

function resetView(){ if(youMarker){ map.removeLayer(youMarker); youMarker=null; } pcMsg.textContent=''; map.flyTo(HOME.center, HOME.zoom, {duration:.8}); }
// ---- Postcode search (free postcodes.io, no API key) ----
let youMarker = null;
const pcInput = document.getElementById('pcInput');
const pcBtn = document.getElementById('pcBtn');
const pcMsg = document.getElementById('pcMsg');
const youIcon = L.divIcon({className:'', html:'<div class="you-pin"></div>', iconSize:[20,20], iconAnchor:[10,20]});

async function findPostcode(){
  const raw = (pcInput.value||'').trim();
  if(!raw){ pcMsg.textContent='Please type a postcode.'; pcMsg.className='pc-msg err'; return; }
  pcMsg.textContent='Searching…'; pcMsg.className='pc-msg';
  try{
    const res = await fetch('https://api.postcodes.io/postcodes/'+encodeURIComponent(raw));
    if(!res.ok){ throw new Error('not found'); }
    const data = await res.json();
    if(!data.result || data.result.latitude==null){ throw new Error('not found'); }
    const lat = data.result.latitude, lng = data.result.longitude;
    if(youMarker){ map.removeLayer(youMarker); }
    youMarker = L.marker([lat,lng],{icon:youIcon,zIndexOffset:1000}).addTo(map)
      .bindPopup('<div class="pop-pc"><b>'+data.result.postcode+'</b><br>Your area</div>');
    map.flyTo([lat,lng], 13, {duration:.9});
    youMarker.openPopup();
    pcMsg.textContent='Showing installs near '+data.result.postcode+'.';
    pcMsg.className='pc-msg';
  }catch(e){
    pcMsg.textContent='Sorry, we could not find that postcode. Please check and try again.';
    pcMsg.className='pc-msg err';
  }
}
pcBtn.addEventListener('click', findPostcode);
pcInput.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); findPostcode(); } });

</script>
